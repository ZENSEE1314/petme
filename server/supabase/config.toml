# Supabase project config.
# This file is committed to version control; secrets go in .env (gitignored).

project_id = "smooth-giraffe"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # set true in production

[edge_functions]
enabled = true

# Functions that don't require a logged-in user (cron only)
[functions.tick-needs]
verify_jwt = false
